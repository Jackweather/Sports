<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Game Log Insights</title>
    <!-- Removed broken betting_style.css link -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #181c23;
            color: #f5f6fa;
            overflow-x: hidden;
        }
            body {
            min-height: 100vh;
                -webkit-text-size-adjust: 100%;
                min-height: 100dvh;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
        }
        .main-full {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
                padding: 0 max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            box-sizing: border-box;
        }
        #currentYankeesGame {
            text-align: center;
            font-size: 1.25rem;
            color: #00e676;
            margin: 32px 0 24px 0;
            max-width: 700px;
            line-height: 1.4;
        }
        #playerLineDisplay {
            text-align: center;
            font-size: 1rem;
            color: #7dd3fc;
            margin: -10px 0 22px 0;
            max-width: 760px;
            line-height: 1.4;
            min-height: 1.4em;
        }
        #bestHitRateDisplay {
            text-align: center;
            font-size: 0.95rem;
            color: #ffd600;
            margin: -4px 0 16px 0;
            max-width: 760px;
            line-height: 1.4;
            min-height: 1.4em;
        }
        #sportIndicator {
            color: #ffd600;
            border: 1px solid #ffd600;
            border-radius: 999px;
            padding: 6px 14px;
            margin-top: 12px;
            margin-bottom: 20px;
            letter-spacing: 0.08em;
            font-size: 0.9rem;
        }
        .controls-row, .stat-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
        }
        .chart-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #judgeBarChart {
            width: min(92vw, 1200px) !important;
            max-width: 1200px;
            height: 60vh !important;
            background: #232a34;
            border-radius: 8px;
            padding: 0;
        }
        button, select, label {
              font-size: 16px;
        }
        label {
            white-space: nowrap;
        }
        button {
            padding: 7px 18px;
            border-radius: 6px;
            border: none;
            background: #232a34;
            color: #00e676;
            cursor: pointer;
            transition: background 0.2s;
            min-height: 40px;
        }
        button.active, button:active {
            background: #232a34;
            color: #00e676;
        }
        select {
            background: #232a34;
            color: #f5f6fa;
            border-radius: 6px;
            border: 1px solid #2e3743;
            padding: 4px 10px;
            min-height: 40px;
            max-width: 100%;
                -webkit-appearance: none;
                appearance: none;
        }
            .selector-row {
                align-items: flex-end;
            }
            .threshold-row {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 10px;
                max-width: 1100px;
            }
            .threshold-controls {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 8px;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            .threshold-controls input[type="range"] {
                flex: 1 1 240px;
                min-width: 0;
            }
        @media (max-width: 768px) {
            .main-full {
                    padding: 0 max(12px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            }
            #playerHeading {
                text-align: center;
                font-size: 1.5rem !important;
                line-height: 1.25;
                margin-top: 24px !important;
            }
            #currentYankeesGame {
                font-size: 1rem;
                margin: 20px 0 18px 0;
            }
            .controls-row, .stat-row {
                gap: 10px;
                margin-bottom: 14px;
            }
                .sport-switch-row,
                .filter-row {
                    display: grid;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    align-items: stretch;
            }
                .selector-row {
                    display: grid;
                    grid-template-columns: 1fr;
                    align-items: stretch;
                }
                .selector-row label {
                width: 100%;
                text-align: left;
            }
                .selector-row select,
                .sport-switch-row button,
                .filter-row button {
                width: 100%;
            }
                .threshold-row {
                    align-items: stretch;
                }
                .threshold-controls {
                    justify-content: stretch;
                    gap: 8px;
                }
                .threshold-controls label,
                .threshold-controls span {
                    width: 100%;
                    text-align: left;
                }
            #judgeBarChart {
                width: 100% !important;
                height: 48vh !important;
                min-height: 320px;
            }
            #sportIndicator {
                margin-bottom: 16px;
            }
        }
        @media (max-width: 480px) {
            body {
                font-size: 15px;
            }
                .sport-switch-row,
                .filter-row {
                    grid-template-columns: 1fr;
                }
            #judgeBarChart {
                height: 42vh !important;
                min-height: 280px;
            }
        }
    </style>
    <div class="main-full">
        <h2 id="playerHeading" style="margin-top:32px; color:#ffd600; font-size:2rem; letter-spacing:1px;">Game Log & Insights</h2>
        <div id="sportIndicator">MLB</div>
        <div id="currentYankeesGame"></div>
        <div id="playerLineDisplay"></div>
        <div class="controls-row sport-switch-row">
            <button id="mlbSportBtn" class="active">MLB</button>
            <button id="nbaSportBtn">NBA</button>
        </div>
        <div class="controls-row selector-row">
            <label for="playerSelect">Player:</label>
            <select id="playerSelect"></select>
            <label for="opponentSelect">Opponent:</label>
            <select id="opponentSelect"></select>
            <label for="statSelect">Stat:</label>
            <select id="statSelect"></select>
            <button id="opponentOnlyBtn" type="button">Opponent Only: Off</button>
        </div>
        <div class="controls-row filter-row">
            <button id="allBtn" class="active">All</button>
            <button id="last5Btn">Last 5</button>
            <button id="last10Btn">Last 10</button>
            <button id="hh5Btn">Last 5 vs Opponent</button>
            <button id="hh10Btn">Last 10 vs Opponent</button>
            <button id="bestHitRateBtn">Best Hit Rate</button>
            <select id="bestRankSelect" aria-label="Best rank selector">
                <option value="1">Best</option>
                <option value="2">2nd Best</option>
                <option value="3">3rd Best</option>
            </select>
        </div>
        <div id="bestHitRateDisplay"></div>
        <div class="threshold-row">
            <div class="threshold-controls">
                <label for="thresholdInput" style="color:#ffd600; font-size:1.05rem;">Threshold:</label>
                <input type="range" id="thresholdInput" min="0" max="75" step="0.5" value="1" style="width:min(240px, 60vw); max-width:100%;">
                <span id="thresholdValue" style="color:#ffd600; font-size:1.05rem;">1</span>
            </div>
        </div>
        <div class="chart-area">
            <canvas id="judgeBarChart"></canvas>
        </div>
    </div>
    <script>
        // Register annotation plugin ONCE at script load
        if (window.Chart && window['chartjs-plugin-annotation'] && !window.__annotationRegistered) {
            window.Chart.register(window['chartjs-plugin-annotation']);
            window.__annotationRegistered = true;
        }
        let allGames = [];
        let currentOpponent = '';
        let currentSport = 'mlb';
        let opponentOnlyMode = false;
        let teamsBySport = { mlb: [], nba: [] };
        let filteredPlayers = [];
        const filterLabels = {
            all: 'All',
            last5: 'Last 5',
            last10: 'Last 10',
            hh5: 'Last 5 vs Opponent',
            hh10: 'Last 10 vs Opponent'
        };
        const sportConfigs = {
            mlb: {
                label: 'MLB',
                stats: [
                    { value: 'H', label: 'Hits' },
                    { value: 'HR', label: 'Home Runs' },
                    { value: 'RBI', label: 'RBI' },
                    { value: 'SB', label: 'Stolen Bases' },
                    { value: 'BB', label: 'Walks' }
                ]
            },
            nba: {
                label: 'NBA',
                stats: [
                    { value: 'PTS', label: 'Points' },
                    { value: 'REB', label: 'Rebounds' },
                    { value: 'AST', label: 'Assists' },
                    { value: 'STL', label: 'Steals' }
                ]
            }
        };
        // Track current filter for chart
        let currentChartFilter = 'all';
        function getOpponentCode(opp) {
            return String(opp || '').replace(/^(@|vs)\s*/, '');
        }
        function getSportTeams() {
            return teamsBySport[currentSport] || [];
        }
        function updateSportUI() {
            const sportConfig = sportConfigs[currentSport] || sportConfigs.mlb;
            const sportIndicator = document.getElementById('sportIndicator');
            const statSelect = document.getElementById('statSelect');
            sportIndicator.textContent = sportConfig.label;
            statSelect.innerHTML = sportConfig.stats.map(stat => `<option value="${stat.value}">${stat.label}</option>`).join('');
            document.getElementById('mlbSportBtn').classList.toggle('active', currentSport === 'mlb');
            document.getElementById('nbaSportBtn').classList.toggle('active', currentSport === 'nba');
            statSelect.onchange = function() {
                renderJudgeBarChart();
                fetchPlayerLine();
            };
        }
        function populatePlayerSelect() {
            const playerSelect = document.getElementById('playerSelect');
            filteredPlayers = allPlayers.filter(player => player.sport === currentSport);
            playerSelect.innerHTML = filteredPlayers.map(player => `<option value="${player.id}">${player.name}</option>`).join('');
            if (!filteredPlayers.some(player => player.id === currentPlayerId)) {
                currentPlayerId = filteredPlayers[0]?.id || null;
            }
            playerSelect.value = currentPlayerId;
        }
        async function switchSport(sport) {
            if (currentSport === sport && currentPlayerId) {
                return;
            }
            currentSport = sport;
            currentOpponent = '';
            populatePlayerSelect();
            updateSportUI();
            if (currentPlayerId) {
                await loadPlayerDataAndUpdate();
            }
        }
        function getFilteredGamesForChart() {
            const selectedOpponent = getOpponentCode(currentOpponent);
            const baseGames = opponentOnlyMode
                ? allGames.filter(g => getOpponentCode(g.OPP) === selectedOpponent)
                : allGames;
            switch (currentChartFilter) {
                case 'all':
                    return baseGames;
                case 'last5':
                    return baseGames.slice(0, 5);
                case 'last10':
                    return baseGames.slice(0, 10);
                case 'hh5':
                    return allGames.filter(g => getOpponentCode(g.OPP) === selectedOpponent).slice(0, 5);
                case 'hh10':
                    return allGames.filter(g => getOpponentCode(g.OPP) === selectedOpponent).slice(0, 10);
                default:
                    return baseGames;
            }
        }
        function getGamesForFilter(filterKey) {
            const previousFilter = currentChartFilter;
            currentChartFilter = filterKey;
            const games = getFilteredGamesForChart();
            currentChartFilter = previousFilter;
            return games;
        }
        function getGamesForScenario(filterKey, opponentCode, opponentOnly, statValue) {
            const previousFilter = currentChartFilter;
            const previousOpponent = currentOpponent;
            const previousOpponentOnlyMode = opponentOnlyMode;

            currentChartFilter = filterKey;
            currentOpponent = opponentCode;
            opponentOnlyMode = opponentOnly;

            const games = getFilteredGamesForChart();
            const hits = games.reduce((count, game) => count + ((parseFloat(game[statValue]) || 0) >= parseFloat(document.getElementById('thresholdInput')?.value || 1) ? 1 : 0), 0);

            currentChartFilter = previousFilter;
            currentOpponent = previousOpponent;
            opponentOnlyMode = previousOpponentOnlyMode;

            return {
                games,
                hits,
                total: games.length,
                rate: games.length ? hits / games.length : 0
            };
        }
        function clearBestHitRateDisplay() {
            const el = document.getElementById('bestHitRateDisplay');
            if (el) {
                el.textContent = '';
            }
        }
        function updateOpponentOnlyButton() {
            const button = document.getElementById('opponentOnlyBtn');
            if (button) {
                button.textContent = `Opponent Only: ${opponentOnlyMode ? 'On' : 'Off'}`;
                button.classList.toggle('active', opponentOnlyMode);
            }
        }
        function setActiveFilterButton(filterKey) {
            const filterButtonMap = {
                all: document.getElementById('allBtn'),
                last5: document.getElementById('last5Btn'),
                last10: document.getElementById('last10Btn'),
                hh5: document.getElementById('hh5Btn'),
                hh10: document.getElementById('hh10Btn')
            };
            Object.values(filterButtonMap).forEach(button => {
                if (button) {
                    button.classList.remove('active');
                }
            });
            const activeButton = filterButtonMap[filterKey];
            if (activeButton) {
                activeButton.classList.add('active');
            }
        }
        function applyFilter(filterKey) {
            currentChartFilter = filterKey;
            setActiveFilterButton(filterKey);
            renderJudgeBarChart();
        }
        async function fetchPlayerMatchup(playerId) {
            let response = await fetch(`/api/current_game/${playerId}`);
            let data = await response.json();
            if (!response.ok || data.error || !data.opponent) {
                response = await fetch(`/api/next_game/${playerId}`);
                data = await response.json();
            }
            if (!response.ok || data.error || !data.opponent) {
                return null;
            }

            let opponentCode = data.opponent_abbr || '';
            if (!opponentCode && data.opponent) {
                const teams = getSportTeams();
                const teamMatch = teams.find(team => team.name === data.opponent || data.opponent.trim().endsWith(team.name.trim()));
                if (teamMatch) {
                    opponentCode = teamMatch.abbreviation;
                }
            }

            return {
                opponent: data.opponent,
                opponentCode: getOpponentCode(opponentCode)
            };
        }
        async function fetchBestSportMatchupScenario() {
            await fetchTeamsForSport(currentSport);
            const sportPlayers = allPlayers.filter(player => player.sport === currentSport);
            const statOptions = (sportConfigs[currentSport] || sportConfigs.mlb).stats;
            const threshold = parseFloat(document.getElementById('thresholdInput')?.value || 1);
            const results = [];

            for (const player of sportPlayers) {
                const matchup = await fetchPlayerMatchup(player.id);
                if (!matchup || !matchup.opponentCode) {
                    continue;
                }

                const gamesResponse = await fetch(`/api/games/${player.id}`);
                const games = await gamesResponse.json();
                if (!gamesResponse.ok || !Array.isArray(games)) {
                    continue;
                }

                const opponentGames = games.filter(game => getOpponentCode(game.OPP) === matchup.opponentCode);
                if (!opponentGames.length) {
                    continue;
                }

                for (const statOption of statOptions) {
                    const hits = opponentGames.reduce((count, game) => count + ((parseFloat(game[statOption.value]) || 0) >= threshold ? 1 : 0), 0);
                    const rate = hits / opponentGames.length;
                    results.push({
                        playerId: player.id,
                        playerName: player.name,
                        statValue: statOption.value,
                        statLabel: statOption.label,
                        opponent: matchup.opponent,
                        opponentCode: matchup.opponentCode,
                        hits,
                        total: opponentGames.length,
                        rate
                    });
                }
            }

            results.sort((left, right) => {
                if (right.rate !== left.rate) {
                    return right.rate - left.rate;
                }
                if (right.total !== left.total) {
                    return right.total - left.total;
                }
                return right.hits - left.hits;
            });

            return results;
        }
        async function applyBestHitRateFilter() {
            const rankSelect = document.getElementById('bestRankSelect');
            const selectedRank = Math.max(1, parseInt(rankSelect?.value || '1', 10));
            const results = await fetchBestSportMatchupScenario();
            const result = results[selectedRank - 1];
            const el = document.getElementById('bestHitRateDisplay');
            if (!result) {
                el.textContent = `No ${selectedRank}${selectedRank === 1 ? 'st' : selectedRank === 2 ? 'nd' : 'rd'} current matchup result found for this sport.`;
                return;
            }

            currentPlayerId = result.playerId;
            populatePlayerSelect();
            await loadPlayerDataAndUpdate();

            const statSelect = document.getElementById('statSelect');
            const opponentSelect = document.getElementById('opponentSelect');
            if (statSelect) {
                statSelect.value = result.statValue;
            }
            if (opponentSelect && result.opponentCode) {
                opponentSelect.value = result.opponentCode;
            }

            currentOpponent = result.opponentCode;
            opponentOnlyMode = true;
            updateOpponentOnlyButton();
            applyFilter('all');
            fetchPlayerLine();

            const rankLabel = selectedRank === 1 ? 'Best' : selectedRank === 2 ? '2nd Best' : '3rd Best';
            el.textContent = `${rankLabel} current matchup: ${result.playerName} ${result.statLabel} vs ${result.opponentCode} at ${(result.rate * 100).toFixed(0)}% (${result.hits}/${result.total}) over the current threshold.`;
        }
        function renderJudgeBarChart() {
            // Annotation plugin is already registered at script load
            const stat = document.getElementById('statSelect') ? document.getElementById('statSelect').value : 'H';
            const statLabels = Object.fromEntries((sportConfigs[currentSport] || sportConfigs.mlb).stats.map(statOption => [statOption.value, statOption.label]));
            let games = getFilteredGamesForChart().slice(0, 10).reverse();
            const labels = games.map(g => g.Date);
            const dataArr = games.map(g => parseInt(g[stat], 10) || 0);
            // Calculate average for the stat (ignore NaN/undefined)
            const validVals = dataArr.filter(v => typeof v === 'number' && !isNaN(v));
            const avg = validVals.length > 0 ? (validVals.reduce((a, b) => a + b, 0) / validVals.length) : 0;
            // Get threshold value
            const threshold = parseFloat(document.getElementById('thresholdInput')?.value || 1);
            // Set bar colors based on threshold
            const barColors = dataArr.map(v => (v >= threshold ? '#00e676' : '#ff1744'));
            const zeroIndicatorData = dataArr.map(v => (v === 0 ? 0 : null));
            const ctx = document.getElementById('judgeBarChart').getContext('2d');
            if (window.judgeBarChart && typeof window.judgeBarChart.destroy === 'function') window.judgeBarChart.destroy();
            window.judgeBarChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: statLabels[stat], data: dataArr, backgroundColor: barColors },
                        {
                            type: 'line',
                            label: 'Zero indicator',
                            data: zeroIndicatorData,
                            showLine: false,
                            pointRadius: 5,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#ff1744',
                            pointBorderColor: '#ffffff',
                            pointBorderWidth: 1,
                            clip: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#f5f6fa',
                                filter: function(legendItem) {
                                    return legendItem.text !== 'Zero indicator';
                                }
                            }
                        },
                        annotation: {
                            annotations: {
                                thresholdLine: {
                                    type: 'line',
                                    yMin: threshold,
                                    yMax: threshold,
                                    borderColor: '#ffd600',
                                    borderWidth: 2,
                                    borderDash: [4,2],
                                    label: {
                                        display: true,
                                        content: `Threshold (${threshold})`,
                                        color: '#ffd600',
                                        position: 'end'
                                    }
                                },
                                avgLine: {
                                    type: 'line',
                                    yMin: avg,
                                    yMax: avg,
                                    borderColor: '#2979ff',
                                    borderWidth: 2,
                                    borderDash: [6,3],
                                    label: {
                                        display: true,
                                        content: `Avg (${avg.toFixed(2)})`,
                                        color: '#2979ff',
                                        position: 'start'
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#b0bec5',
                                autoSkip: true,
                                maxTicksLimit: 6,
                                maxRotation: 45,
                                minRotation: 0
                            },
                            grid: { color: '#2e3743' }
                        },
                        y: { ticks: { color: '#b0bec5' }, grid: { color: '#2e3743' } }
                    }
                }
            });
        }


        // Threshold slider event
        const thresholdInput = document.getElementById('thresholdInput');
        const thresholdValue = document.getElementById('thresholdValue');
        if (thresholdInput && thresholdValue) {
            thresholdInput.oninput = function() {
                // Always show value with one decimal, but .0 as .0
                thresholdValue.textContent = parseFloat(this.value).toFixed(1);
                clearBestHitRateDisplay();
                renderJudgeBarChart();
            };
            // Set initial display value
            thresholdValue.textContent = parseFloat(thresholdInput.value).toFixed(1);
        }



        async function fetchTeamsForSport(sport) {
            try {
                const res = await fetch(`/api/teams/${sport}`);
                teamsBySport[sport] = await res.json();
            } catch {
                teamsBySport[sport] = [];
            }
        }

        async function autoSelectOpponent() {
            try {
                const res = await fetch(`/api/next_game/${currentPlayerId}`);
                const data = await res.json();
                if (data.opponent_abbr) {
                    if (allGames.some(g => getOpponentCode(g.OPP) === data.opponent_abbr)) {
                        currentOpponent = data.opponent_abbr;
                    }
                } else if (data.opponent) {
                    // fallback: try to match by name
                    let abbr = '';
                    const teams = getSportTeams();
                    if (teams.length > 0) {
                        const opp = teams.find(t => data.opponent.trim().endsWith(t.name.trim()));
                        if (opp) abbr = opp.abbreviation;
                    }
                    if (abbr) {
                        if (allGames.some(g => getOpponentCode(g.OPP) === abbr)) {
                            currentOpponent = abbr;
                        }
                    } else {
                        // fallback: try to match by partial name
                        const opp2 = allGames.find(g => data.opponent && data.opponent.includes(g.OPP));
                        if (opp2) currentOpponent = getOpponentCode(opp2.OPP);
                    }
                }
            } catch {}
        }

        function populateOpponentSelect() {
            const select = document.getElementById('opponentSelect');
            const opps = Array.from(new Set(allGames.map(g => getOpponentCode(g.OPP)))).sort();
            select.innerHTML = opps.map(o => `<option value="${o}">${o}</option>`).join('');
            // If currentOpponent is set (from autoSelectOpponent), select it
            currentOpponent = getOpponentCode(currentOpponent);
            if (currentOpponent && opps.includes(currentOpponent)) {
                select.value = currentOpponent;
            } else {
                currentOpponent = select.value;
            }
            select.onchange = function() {
                currentOpponent = getOpponentCode(this.value);
                clearBestHitRateDisplay();
                renderJudgeBarChart();
            };
        }
        document.getElementById('allBtn').onclick = function() {
            clearBestHitRateDisplay(); applyFilter('all');
        };
        document.getElementById('last5Btn').onclick = function() {
            clearBestHitRateDisplay(); applyFilter('last5');
        };
        document.getElementById('last10Btn').onclick = function() {
            clearBestHitRateDisplay(); applyFilter('last10');
        };
        document.getElementById('hh5Btn').onclick = function() {
            clearBestHitRateDisplay(); applyFilter('hh5');
        };
        document.getElementById('hh10Btn').onclick = function() {
            clearBestHitRateDisplay(); applyFilter('hh10');
        };
        document.getElementById('bestHitRateBtn').onclick = async function() {
            await applyBestHitRateFilter();
        };
        document.getElementById('opponentOnlyBtn').onclick = function() {
            opponentOnlyMode = !opponentOnlyMode;
            clearBestHitRateDisplay();
            updateOpponentOnlyButton();
            renderJudgeBarChart();
        };
        async function fetchCurrentGame() {
            const el = document.getElementById('currentYankeesGame');
            try {
                // Try to get current game first
                let res = await fetch(`/api/current_game/${currentPlayerId}`);
                let data = await res.json();
                if (!data.error && data.opponent) {
                    el.textContent = `${data.opponent} (${data.homeAway}) on ${data.date} at ${data.time}`;
                    return;
                }
                // If no current game, show next game
                res = await fetch(`/api/next_game/${currentPlayerId}`);
                data = await res.json();
                if (!data.error && data.opponent) {
                    el.textContent = `Next: ${data.opponent} (${data.homeAway}) on ${data.date} at ${data.time}`;
                } else {
                    el.textContent = 'No upcoming games.';
                }
            } catch {
                el.textContent = 'No upcoming games.';
            }
        }

        async function fetchPlayerLine() {
            const el = document.getElementById('playerLineDisplay');
            const stat = document.getElementById('statSelect') ? document.getElementById('statSelect').value : '';
            const statOption = (sportConfigs[currentSport] || sportConfigs.mlb).stats.find(option => option.value === stat);
            const thresholdInput = document.getElementById('thresholdInput');
            const thresholdValue = document.getElementById('thresholdValue');
            if (!currentPlayerId || !stat) {
                el.textContent = '';
                return;
            }

            el.textContent = 'Loading line...';
            try {
                const res = await fetch(`/api/player_line/${currentPlayerId}/${stat}`);
                const data = await res.json();
                if (!res.ok || data.error || !data.line) {
                    el.textContent = data.error || 'No line available for selected stat.';
                    return;
                }

                const label = statOption ? statOption.label : stat;
                const overPrice = data.line.over_price ?? '--';
                const underPrice = data.line.under_price ?? '--';
                const linePoint = Number(data.line.point);
                if (!Number.isNaN(linePoint) && thresholdInput && thresholdValue) {
                    if (linePoint > Number(thresholdInput.max)) {
                        thresholdInput.max = String(Math.ceil(linePoint));
                    }
                    thresholdInput.value = String(linePoint);
                    thresholdValue.textContent = linePoint.toFixed(1);
                    renderJudgeBarChart();
                }
                el.textContent = `${label} line: ${data.line.point} at ${data.line.bookmaker} | O ${overPrice} / U ${underPrice}`;
            } catch {
                el.textContent = 'Unable to load player line.';
            }
        }

        // --- Player selection logic ---
        let allPlayers = [];
        let currentPlayerId = null;
        let playerName = '';

        async function fetchPlayers() {
            const res = await fetch('/api/players');
            allPlayers = await res.json();
            const playerSelect = document.getElementById('playerSelect');
            currentSport = 'mlb';
            opponentOnlyMode = false;
            updateOpponentOnlyButton();
            populatePlayerSelect();
            playerSelect.onchange = function() {
                currentPlayerId = this.value;
                clearBestHitRateDisplay();
                loadPlayerDataAndUpdate();
            };
        }

        function getCurrentPlayer() {
            return allPlayers.find(player => player.id === currentPlayerId);
        }

        async function fetchPlayerName(playerId) {
            const res = await fetch(`/api/player_name/${playerId}`);
            const data = await res.json();
            playerName = data.player_name || '';
            currentSport = data.sport || getCurrentPlayer()?.sport || 'mlb';
            clearBestHitRateDisplay();
            updateOpponentOnlyButton();
            populatePlayerSelect();
            updateSportUI();
            const heading = document.getElementById('playerHeading');
            if (!playerName || playerName === 'Unknown Player') {
                heading.textContent = 'Game Log & Insights';
            } else {
                heading.textContent = `${playerName} ${sportConfigs[currentSport].label} Game Log & Insights`;
            }
        }

        async function fetchGamesForPlayer(playerId) {
            const res = await fetch(`/api/games/${playerId}`);
            allGames = await res.json();
        }

        async function loadPlayerDataAndUpdate() {
            if (!currentPlayerId) {
                allGames = [];
                populateOpponentSelect();
                renderJudgeBarChart();
                return;
            }
            await fetchPlayerName(currentPlayerId);
            await fetchGamesForPlayer(currentPlayerId);
            await fetchTeamsForSport(currentSport);
            await autoSelectOpponent();
            populateOpponentSelect();
            renderJudgeBarChart();
            fetchCurrentGame();
            fetchPlayerLine();
        }

        // Override renderJudgeBarChart to use playerName in heading if needed
        // (already handled by heading update)

        // On page load, fetch players, then load data for first player
        (async function init() {
            document.getElementById('mlbSportBtn').onclick = function() {
                switchSport('mlb');
            };
            document.getElementById('nbaSportBtn').onclick = function() {
                switchSport('nba');
            };
            await fetchPlayers();
            await loadPlayerDataAndUpdate();
        })();
    </script>
</body>
</html>
